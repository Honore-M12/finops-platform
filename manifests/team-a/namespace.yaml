apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    finops-managed: "true"
  annotations:
    # Plafond dur (ResourceQuota via Kyverno), independant du seuil
    # FinOps (costThreshold) - defense en profondeur, decision 5.5.
    # Empreinte totale actuelle : API (3x100m/64Mi=300m/192Mi) + service
    # secondaire (2x100m/64Mi=200m/128Mi) = 500m/320Mi. Quota recalibre
    # avec la meme marge relative qu'avant l'ajout du secondaire (~1.7x).
    finops.yougos.io/quota-cpu: "1000m"
    finops.yougos.io/quota-memory: "640Mi"
