# Profil "API stateless" pour team-a : service front expose, replique
# pour la disponibilite/charge, empreinte legere par instance. C'est ce
# profil qui sert aussi de cible reelle a l'action corrective de
# l'operateur (scale-down/rollback), demontre en conditions reelles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workload
  namespace: team-a
  labels:
    finops-role: api-stateless
spec:
  replicas: 3
  selector:
    matchLabels:
      app: test-workload
  template:
    metadata:
      labels:
        app: test-workload
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
