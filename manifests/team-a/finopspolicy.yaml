apiVersion: finops.yougos.io/v1
kind: FinOpsPolicy
metadata:
  name: team-a-policy
  namespace: team-a
spec:
  # RECALIBRE le 2026-09-05 avec la mesure reelle post-ajout du service
  # secondaire (0.0171295625, stable sur plusieurs cycles) x1.5 de marge.
  # L'ancienne valeur (0.0154, calibree sur l'API seule) etait DURABLEMENT
  # inferieure au cout de repos reel (API + secondaire), ce qui a cause
  # une oscillation observee en conditions reelles : le rollback se
  # decide sur le cout OBSERVE, qui chute trivialement pendant que
  # l'action corrective est active ; des que la policy est restauree a
  # la normale, le vrai cout de repos redepasse le seuil, redeclenchant
  # une action, dans une boucle infinie. Limite architecturale documentee
  # (Ch5) : ce mecanisme absorbe des pics transitoires, pas un
  # depassement structurel/permanent du budget de repos - dans ce
  # dernier cas, la seule sortie saine est de recalibrer costThreshold
  # (ou reduire durablement la capacite via Git), pas de laisser
  # l'auto-remediation osciller indefiniment.
  costThreshold: 0.01  # TEMPORAIRE, pour la demo - sera remis a 0.0257 juste apres
  evaluationWindow: "10m"
  consecutiveCyclesThreshold: 3
  actions:
    # Priorite 1 : service non-critique, scale a 0 en premier (aucun
    # impact utilisateur direct).
    - target: test-workload-batch-secondaire
      minReplicas: 0
      priority: 1
    # Priorite 2 : API principale, escaladee seulement si le
    # depassement persiste malgre la degradation du service secondaire.
    - target: test-workload
      minReplicas: 1
      priority: 2
