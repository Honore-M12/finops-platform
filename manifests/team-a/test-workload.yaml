# Charge de test minimale pour que OpenCost ait quelque chose a mesurer
# dans team-a et permettre de valider le handler Kopf en conditions
# reelles. A remplacer par de vraies charges applicatives du tenant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workload
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-workload
  template:
    metadata:
      labels:
        app: test-workload
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
