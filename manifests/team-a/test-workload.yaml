# Charge de test pour OpenCost (mesure de cout) ET cible reelle de
# l'action corrective de l'operateur (scale-down/rollback). replicas: 3
# au depart pour que le scale-down vers minReplicas soit visible et ait
# un effet mesurable sur namespace_cost_total. A remplacer par de vraies
# charges applicatives du tenant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workload
  namespace: team-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: test-workload
  template:
    metadata:
      labels:
        app: test-workload
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
