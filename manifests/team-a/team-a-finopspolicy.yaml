apiVersion: finops.yougos.io/v1
kind: FinOpsPolicy
metadata:
  name: team-a-policy
  namespace: team-a
spec:
  # Seuil calibre sur le cout mesure en regime nominal du profil API
  # (0.01028, cf. mesure du 2026-09-04) x1.5 de marge avant de considerer
  # un depassement comme une derive budgetaire, pas juste du bruit.
  costThreshold: 0.0154
  evaluationWindow: "10m"
  targetDeployment: test-workload
  minReplicas: 1
  consecutiveCyclesThreshold: 3
