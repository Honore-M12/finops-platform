apiVersion: finops.yougos.io/v1
kind: FinOpsPolicy
metadata:
  name: team-b-policy
  namespace: team-b
spec:
  # Seuil placeholder volontairement haut : cette equipe sert a demontrer
  # le passage a l'echelle multi-tenant, pas encore l'action corrective.
  # targetDeployment/minReplicas non definis pour l'instant (calibrage
  # tarifaire par equipe differe, point 5.2 du plan) - un DEPASSEMENT
  # confirme sur cette policy loggue une erreur explicite ("action
  # corrective impossible") plutot que d'echouer silencieusement.
  costThreshold: 1000000
  evaluationWindow: "10m"
