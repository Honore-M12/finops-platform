# Profil "worker/batch" pour team-b : traitement en arriere-plan
# (ex. generation de rapports, traitement de fichiers). CPU-intensif,
# peu de replicas - a l'oppose du profil API stateless de team-a.
# busybox + boucle infinie simule une charge de travail continue sans
# necessiter une vraie image applicative pour la demonstration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workload
  namespace: team-b
  labels:
    finops-role: worker-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-workload
  template:
    metadata:
      labels:
        app: test-workload
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo traitement en cours; sleep 5; done"]
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
