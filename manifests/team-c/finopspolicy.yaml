apiVersion: finops.yougos.io/v1
kind: FinOpsPolicy
metadata:
  name: team-c-policy
  namespace: team-c
spec:
  # Seuil calibre sur le cout mesure en regime nominal du profil cache
  # (0.01056, cf. mesure du 2026-09-04) x1.5 de marge.
  costThreshold: 0.005
  evaluationWindow: "10m"
  consecutiveCyclesThreshold: 3
  actions:
    # Une seule cible pour team-c : minReplicas 1, un cache doit garder
    # une instance disponible en mode degrade, contrairement a un batch
    # suspendable (team-b).
    - target: test-workload
      minReplicas: 1
      priority: 1
