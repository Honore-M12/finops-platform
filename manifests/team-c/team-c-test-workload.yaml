# Profil "cache applicatif" pour team-c : cache memoire-intensif
# (ex. sessions, resultats de requetes frequentes). Peu de CPU, beaucoup
# de memoire allouee, replique pour la disponibilite du cache.
# redis reel plutot qu'une image generique : plus representatif du
# pattern, et redis fonctionne out-of-the-box sans configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workload
  namespace: team-c
  labels:
    finops-role: cache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-workload
  template:
    metadata:
      labels:
        app: test-workload
    spec:
      containers:
        - name: cache
          image: redis:7-alpine
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 200m
              memory: 768Mi
