# Voir team-b/test-workload.yaml pour le raisonnement complet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-workload
  namespace: team-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-workload
  template:
    metadata:
      labels:
        app: test-workload
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
