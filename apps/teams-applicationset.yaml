# Extension du principe App-of-Apps pour le multi-tenant : au lieu d'un
# fichier Application par equipe (repetitif, remplace ici team-a.yaml),
# un seul generateur decouvre automatiquement chaque dossier
# manifests/team-* dans Git et cree l'Application correspondante. Ajouter
# une equipe = ajouter un dossier manifests/team-X/, rien d'autre a
# toucher dans apps/. finops-root continue d'orchestrer normalement :
# cet ApplicationSet est lui-meme un des "enfants" decouverts par
# finops-root, exactement comme crds.yaml, operator.yaml, etc.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: finops-teams
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Honore-M12/finops-platform.git
        revision: main
        directories:
          - path: manifests/team-*
  template:
    metadata:
      name: 'finopspolicy-{{path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/Honore-M12/finops-platform.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      # Meme conflit potentiel que sur team-a (voir historique) : si une
      # equipe a un Deployment pilote par l'operateur FinOps, ArgoCD ne
      # doit pas ecraser ses scale-down/rollback. managedFieldsManagers
      # (plutot que jsonPointers) cible precisement les changements faits
      # par l'operateur (field_manager="finops-operator", voir
      # scale_deployment dans handlers.py) - Git garde le controle total
      # de spec.replicas pour toute cible sans action corrective active,
      # contrairement a un jsonPointers global qui bloquerait Git pour
      # tout le monde en permanence. Deux entrees ici car team-a a deux
      # cibles d'escalade (voir manifests/team-a/finopspolicy.yaml) -
      # inertes pour les equipes qui n'ont pas ces Deployments.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: test-workload
          namespace: '{{path.basename}}'
          managedFieldsManagers:
            - finops-operator
        - group: apps
          kind: Deployment
          name: test-workload-batch-secondaire
          namespace: '{{path.basename}}'
          managedFieldsManagers:
            - finops-operator
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
