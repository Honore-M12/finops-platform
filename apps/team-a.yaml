# Une Application enfant par tenant. Ce fichier vit dans apps/team-a.yaml
# du repo Git ; le finops-root ci-dessus la découvre automatiquement.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finopspolicy-team-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Honore-M12/finops-platform.git
    targetRevision: main
    path: manifests/team-a          # contient le FinOpsPolicy CR de ce tenant
  destination:
    server: https://kubernetes.default.svc
    namespace: team-a
  # test-workload est a la fois declare en Git (replicas: 3, etat "au repos")
  # ET pilote par l'operateur FinOps (scale-down/rollback en reaction au
  # cout). Sans cette exception, selfHeal ecrase le scale-down de
  # l'operateur des le cycle de reconciliation suivant - deux controleurs
  # en conflit sur le meme champ. ignoreDifferences laisse l'operateur
  # seul maitre sur spec.replicas, tout le reste du Deployment (image,
  # resources, labels...) reste gouverne par Git normalement.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: test-workload
      namespace: team-a
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true                # gouvernance : toute derive manuelle est ecrasee
      prune: true
    syncOptions:
      - CreateNamespace=true
