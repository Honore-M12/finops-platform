# Pointe vers operator/k8s (pas operator/ directement) : ce sous-dossier
# ne contient que des manifestes Kubernetes, pas le code source Python
# (handlers.py, Dockerfile) qu'ArgoCD ne saurait pas interpreter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finops-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Honore-M12/finops-platform.git
    targetRevision: main
    path: operator/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: finops-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
