apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      # Prometheus se scrape lui-meme (metriques internes de sante)
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Decouverte automatique : tout pod portant l'annotation
      # prometheus.io/scrape: "true" est scrape automatiquement, sans
      # modifier cette config quand un nouveau composant (ex: kube-state-metrics)
      # est ajoute au cluster.
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # cAdvisor (usage reel CPU/memoire par conteneur) via le proxy de
      # l'API server - evite les soucis de jointure reseau directe au
      # kubelet et reutilise le token de service account deja monte.
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # OpenCost expose ses metriques de cout calculees sur /metrics:9003
      - job_name: 'opencost'
        static_configs:
          - targets: ['opencost.opencost.svc:9003']

  rules.yml: |
    groups:
      - name: finops-cost-aggregation
        rules:
          # namespace_cost_total : combine allocation (cAdvisor/KSM) et
          # tarification horaire (OpenCost) pour produire un cout total
          # par namespace - c'est cette metrique que le handler Kopf
          # interroge via min_over_time sur evaluationWindow.
          - record: namespace_cost_total
            labels:
              cluster: finops-lab
            expr: |
              sum by (namespace) (
                container_cpu_allocation * on (node) group_left() node_cpu_hourly_cost
                +
                container_memory_allocation_bytes * on (node) group_left() node_ram_hourly_cost / (1024*1024*1024)
              )
