apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: finopspolicies.finops.yougos.io
spec:
  group: finops.yougos.io
  scope: Namespaced
  names:
    plural: finopspolicies
    singular: finopspolicy
    kind: FinOpsPolicy
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - costThreshold
                - evaluationWindow
              properties:
                costThreshold:
                  type: number
                  description: The cost threshold for the policy
                evaluationWindow:
                  type: string
                  description: The evaluation window for the policy
                consecutiveCyclesThreshold:
                  type: integer
                  minimum: 1
                  default: 3
                  description: >-
                    Nombre de cycles de depassement consecutifs requis avant
                    de declencher (ou d'escalader) une action corrective
                    (garde-fou anti-flapping, lissage inter-cycles
                    complementaire au min_over_time intra-fenetre)
                actions:
                  type: array
                  description: >-
                    Liste ordonnee des cibles de scale-down corrective.
                    L'escalade se fait par priorite croissante : la cible de
                    priorite la plus basse est scalee en premier ; les
                    suivantes ne sont declenchees que si le depassement
                    persiste malgre l'action precedente (nouvelle
                    confirmation sur consecutiveCyclesThreshold cycles).
                  items:
                    type: object
                    required:
                      - target
                      - minReplicas
                      - priority
                    properties:
                      target:
                        type: string
                        description: >-
                          Nom du Deployment cible dans le namespace de la
                          policy
                      minReplicas:
                        type: integer
                        minimum: 0
                        description: >-
                          Nombre de replicas cible applique lors du
                          scale-down corrective de cette cible
                      priority:
                        type: integer
                        minimum: 1
                        description: >-
                          Ordre d'escalade (1 = scale en premier). Deux
                          cibles ne devraient pas partager la meme priorite
                          au sein d'une meme policy.
            status:
              type: object
              properties:
                minCostInWindow:
                  type: number
                  description: >-
                    Cout minimum observe sur evaluationWindow (min_over_time),
                    PAS le cout instantane - nomme ainsi pour eviter toute
                    ambiguite (anciennement currentCost, renomme le
                    2026-09-05 car trompeur)
                thresholdExceeded:
                  type: boolean
                  description: Indicates if the cost threshold has been exceeded
                exceededSince:
                  type: string
                  format: date-time
                  description: The timestamp when the threshold was exceeded
                correctiveActionTaken:
                  type: array
                  items:
                    type: string
                  description: >-
                    Journal d'audit des actions correctives et rollbacks
                    effectues (append-only)
                consecutiveExceedances:
                  type: integer
                  description: >-
                    Compteur de cycles de depassement consecutifs, remis a
                    zero des qu'un cycle repasse sous le seuil
                lastActionAtCycle:
                  type: integer
                  description: >-
                    Valeur de consecutiveExceedances au moment de la
                    derniere action declenchee - permet de faire attendre a
                    nouveau consecutiveCyclesThreshold cycles avant
                    d'escalader vers la cible suivante, plutot que
                    d'escalader immediatement des la confirmation initiale.
                baselineCostAtTrigger:
                  type: number
                  nullable: true
                  description: >-
                    Cout observe au moment du TOUT PREMIER declenchement
                    d'une campagne d'actions (avant toute reduction de
                    capacite) - reference geleee du "cout a pleine
                    capacite", utilisee pour decider du rollback
                    independamment du cout observe en direct (qui est
                    mecaniquement bas tant qu'une action est active). Le
                    rollback n'intervient que si baselineCostAtTrigger
                    repasse sous costThreshold (releve dans Git ou capacite
                    normale reduite) - evite l'oscillation action/rollback
                    decouverte le 2026-09-05 sur une policy multi-cibles.
                actionsState:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      actionState:
                        type: string
                        enum: ["NORMAL", "ACTION_TAKEN"]
                      preActionState:
                        type: object
                        nullable: true
                        properties:
                          replicas:
                            type: integer
                  description: >-
                    Etat d'action par cible (cle = nom du Deployment
                    cible), permet l'escalade et le rollback independants
                    de chaque cible d'une meme policy.
      subresources:
        status: {}
