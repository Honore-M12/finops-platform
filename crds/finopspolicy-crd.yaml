apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: finopspolicies.finops.yougos.io
spec:
  group: finops.yougos.io
  scope: Namespaced
  names:
    plural: finopspolicies
    singular: finopspolicy
    kind: FinOpsPolicy
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - costThreshold
                - evaluationWindow
              properties:
                costThreshold:
                  type: integer
                  description: The cost threshold for the policy
                evaluationWindow:
                  type: string
                  description: The evaluation window for the policy
                targetDeployment:
                  type: string
                  description: >-
                    Nom du Deployment cible dans le namespace de la policy,
                    sur lequel l'action corrective (scale-down) est appliquee
                minReplicas:
                  type: integer
                  minimum: 0
                  description: >-
                    Nombre de replicas cible applique au Deployment lors du
                    scale-down corrective
                consecutiveCyclesThreshold:
                  type: integer
                  minimum: 1
                  default: 3
                  description: >-
                    Nombre de cycles de depassement consecutifs requis avant
                    de declencher l'action corrective (garde-fou anti-flapping,
                    lissage inter-cycles complementaire au min_over_time
                    intra-fenetre)
            status:
              type: object
              properties:
                currentCost:
                  type: number
                  description: The current cost associated with the policy
                thresholdExceeded:
                  type: boolean
                  description: Indicates if the cost threshold has been exceeded
                exceededSince:
                  type: string
                  format: date-time
                  description: The timestamp when the threshold was exceeded
                correctiveActionTaken:
                  type: array
                  items:
                    type: string
                  description: >-
                    Journal d'audit des actions correctives et rollbacks
                    effectues (append-only)
                consecutiveExceedances:
                  type: integer
                  description: >-
                    Compteur de cycles de depassement consecutifs, remis a
                    zero des qu'un cycle repasse sous le seuil
                actionState:
                  type: string
                  enum: ["NORMAL", "ACTION_TAKEN"]
                  description: >-
                    Etat de l'action corrective : NORMAL si aucune action
                    active, ACTION_TAKEN si un scale-down est actif en
                    attendant un retour sous le seuil
                preActionState:
                  type: object
                  nullable: true
                  properties:
                    replicas:
                      type: integer
                  description: >-
                    Etat du Deployment cible juste avant l'action corrective,
                    utilise pour le rollback automatique
      subresources:
        status: {}
