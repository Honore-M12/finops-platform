apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-operator
  namespace: finops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-operator
rules:
  # Lecture/ecriture sur les FinOpsPolicy elles-memes (spec, metadata,
  # annotations anti-boucle) - dans n'importe quel namespace tenant.
  - apiGroups: ["finops.yougos.io"]
    resources: ["finopspolicies"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Sous-ressource status - necessaire pour correctiveActionTaken,
  # currentCost, thresholdExceeded.
  - apiGroups: ["finops.yougos.io"]
    resources: ["finopspolicies/status"]
    verbs: ["get", "patch", "update"]
  # Kopf emet des Events Kubernetes standards pour tracer son activite
  # (visibles via kubectl describe / kubectl get events).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Kopf a besoin de surveiller les CRDs elles-memes au demarrage pour
  # detecter les changements de schema - sans ca il bascule en mode
  # degrade (rafraichissement uniquement au redemarrage).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  # Action corrective reelle (4.1) et rollback automatique (4.3) : lecture
  # et modification du nombre de replicas du Deployment cible de chaque
  # FinOpsPolicy. Le sous-type "scale" est ce que patch_namespaced_deployment_scale
  # manipule concretement cote client Kubernetes.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finops-operator
subjects:
  - kind: ServiceAccount
    name: finops-operator
    namespace: finops-system
