# Image construite localement (docker build) puis importee directement
# dans le cluster k3d (k3d image import), sans registre distant - adapte
# a un environnement de developpement local. imagePullPolicy: Never
# empeche Kubernetes de tenter un pull externe et force l'usage de
# l'image deja presente dans le cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-operator
  namespace: finops-system
  labels:
    app: finops-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-operator
  template:
    metadata:
      labels:
        app: finops-operator
      annotations:
        # Decouverte automatique par le job 'kubernetes-pods' de
        # Prometheus (deja configure, aucune modif cote Prometheus
        # necessaire). Expose costThreshold/minCostInWindow/actionState
        # etc. pour le dashboard Grafana (5.6) - source de verite unique,
        # jamais desynchronisee de Git contrairement a des seuils
        # codes en dur dans le dashboard.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: finops-operator
      containers:
        - name: operator
          image: finops-operator:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9100
              name: metrics
          # Pas de endpoint /healthz dedie : le serveur HTTP de
          # prometheus_client (demarre au tout debut de @kopf.on.startup,
          # avant que Kopf ne commence a observer les FinOpsPolicy) sert
          # de signal de sante par proxy. Limitation assumee et
          # documentee (6.3) : ca confirme que le processus repond, pas
          # que la boucle de reconciliation Kopf elle-meme est saine
          # (ex. watch bloque cote API server ne serait pas detecte). Un
          # /healthz dedie interrogeant l'etat interne de Kopf serait
          # plus precis mais represente une complexite non prioritaire
          # face au risque reel sur un operateur mono-replica de PFA.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
